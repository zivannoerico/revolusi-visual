<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 420" width="100%" height="100%" fill="none" stroke="#475569" stroke-linecap="round" stroke-linejoin="round">
  <g>
    <!-- Scent Aroma Waves (Organic Swirls) -->
    <path d="M 120 110 C 150 90, 160 50, 195 45 C 220 40, 230 65, 230 85" stroke="#F59E0B" stroke-width="2.5" stroke-dasharray="4 3"/>
    <path d="M 380 110 C 350 90, 340 50, 305 45 C 280 40, 270 65, 270 85" stroke="#F59E0B" stroke-width="2.5" stroke-dasharray="4 3"/>
    
    <!-- Eyebrows / Upper Brow Ridge -->
    <path d="M 175 75 C 205 60, 235 68, 245 80" stroke="#94A3B8" stroke-width="2.2"/>
    <path d="M 325 75 C 295 60, 265 68, 255 80" stroke="#94A3B8" stroke-width="2.2"/>

    <!-- Left Upper Contour (Bridge of Nose) -->
    <path d="M 235 80 C 238 120, 232 170, 226 210" stroke-width="3"/>
    <path d="M 265 80 C 262 120, 268 170, 274 210" stroke="#CBD5E1" stroke-width="1.8"/>

    <!-- Gentle Shading Accent along Nose Bridge -->
    <path d="M 242 100 L 238 190" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Ball of the Nose (Tip) - Organic Curve with warm fill -->
    <path d="M 218 212 C 225 185, 275 185, 282 212 C 285 240, 215 240, 218 212 Z" stroke-width="3.2" fill="rgba(245,158,11,0.08)"/>

    <!-- Highlight on Nose Tip -->
    <ellipse cx="245" cy="206" rx="10" ry="6" transform="rotate(-15, 245, 206)" fill="#FFFFFF" stroke="none" opacity="0.9"/>

    <!-- Left Nostril Wing (Ala) -->
    <path d="M 215 210 C 190 205, 175 220, 180 234 C 185 246, 208 248, 222 238" stroke-width="3"/>
    <path d="M 188 230 C 194 224, 206 226, 208 234 C 205 239, 195 242, 190 237 Z" fill="#334155" stroke="#334155" stroke-width="1.5"/>

    <!-- Right Nostril Wing (Ala) -->
    <path d="M 285 210 C 310 205, 325 220, 320 234 C 315 246, 292 248, 278 238" stroke-width="3"/>
    <path d="M 312 230 C 306 224, 294 226, 292 234 C 295 239, 305 242, 310 237 Z" fill="#334155" stroke="#334155" stroke-width="1.5"/>

    <!-- Base of Columella (Under-nose curve) -->
    <path d="M 226 238 C 238 245, 262 245, 274 238" stroke-width="2.5"/>

    <!-- Philtrum (Alur di atas bibir) -->
    <path d="M 240 252 C 240 268, 236 280, 234 286" stroke="#94A3B8" stroke-width="2"/>
    <path d="M 260 252 C 260 268, 264 280, 266 286" stroke="#94A3B8" stroke-width="2"/>

    <!-- Inhalation Wind Breeze (Garis Udara Masuk) -->
    <path d="M 160 265 C 175 258, 190 250, 198 242" stroke="#F59E0B" stroke-width="2" stroke-dasharray="3 3"/>
    <path d="M 340 265 C 325 258, 310 250, 302 242" stroke="#F59E0B" stroke-width="2" stroke-dasharray="3 3"/>

    <!-- Clean Badge Without Outline Distortion -->
    <g transform="translate(155, 335)">
      <rect x="0" y="0" width="190" height="38" rx="19" fill="rgba(245,158,11,0.08)" stroke="#F59E0B" stroke-width="1.8"/>
      <text x="95" y="24" font-family="'DM Sans', sans-serif" font-size="14" font-weight="800" fill="#B45309" stroke="none" text-anchor="middle" letter-spacing="1.5">HIDUNG (PENCIUM)</text>
    </g>
  </g>
</svg>
