    <path d="M 250 65 L 250 35" stroke="#F59E0B" stroke-width="2.5" stroke-dasharray="3 3"/>
    <path d="M 345 80 L 375 55" stroke="#F59E0B" stroke-width="2.5" stroke-dasharray="3 3"/>
    <path d="M 155 80 L 125 55" stroke="#F59E0B" stroke-width="2.5" stroke-dasharray="3 3"/>
    <path d="M 400 175 L 435 170" stroke="#F59E0B" stroke-width="2.5"/>
    <path d="M 100 175 L 65 170" stroke="#F59E0B" stroke-width="2.5"/>

    <!-- Eyebrow -->
    <path d="M 135 105 C 190 75, 310 75, 365 100" stroke-width="3.2"/>
    <path d="M 155 95 C 205 75, 290 73, 345 92" stroke="#94A3B8" stroke-width="1.8"/>

